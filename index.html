<!-- 3. TA CARTE BLANCHE AVEC LE TEXTE ET BOUTON -->
<div class="card">
    <div id="step1" class="step active">
        <h1>Pour toi Sanda 🥰 Cliquez sur le grand émoji pour continuer.</h1>
        <button id="btn-start">🥰</button>
    </div>
</div>

    <!-- Étape 2 : Ta présentation / déclaration -->
    <div id="step2" class="step">
        <div id="typewriter-text"></div>
        <button id="btn-to-step3" class="hidden">Continuer ❤️</button>
    </div>

    <!-- Étape 3 : La Question -->
    <div id="step3" class="step">
        <h2>Est-ce que tu veux qu'on se parle et savoir qui je suis  🥰🥰?</h2>
        <div class="buttons-container">
            <button id="btn-yes">OUI ! ❤️</button>
            <button id="btn-no">Non 🙈</button>
        </div>
    </div>

    <!-- Étape 4A : Réponse OUI -->
    <div id="step4-yes" class="step">
        <h2>Super ! 🥰</h2>
        <p>Réponds-moi sur Instagram alors Tiavina Mario ! 🙈</p>
    </div>

    <!-- Étape 4B : Réponse NON -->
    <div id="step4-no" class="step">
        <h2>Oh... Je comprends. 💖</h2>
        <p>Merci quand même d'avoir pris le temps de tout lire !</p>
    </div>
